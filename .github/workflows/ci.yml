name: CI

# 之前仓库没有任何 CI：协议漂移、格式化、客户端编译失败都只能靠人工发现。
# 这里把本地验证过的命令固化下来（Go 构建/vet/测试、protoc 生成物一致性、客户端编译与单测）。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: 格式检查
        working-directory: server
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未 gofmt 格式化："
            echo "$unformatted"
            exit 1
          fi
      - name: 构建与静态检查
        working-directory: server
        run: |
          go build ./...
          go vet ./...
          go vet -tags smoke ./...
      - name: 单元测试（含协议 golden 双端一致性）
        working-directory: server
        run: go test ./...

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 安装 protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - name: 校验生成物与 im.proto 一致
        working-directory: proto
        run: |
          protoc --go_out=../server/internal/pb --go_opt=paths=source_relative -I. im.proto
          cd ..
          git diff --exit-code -- server/internal/pb proto/golden

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: 编译（desktop + compose）
        working-directory: client
        run: |
          # GitHub runner 预装了 Android SDK 并导出 ANDROID_HOME，而构建脚本是
          # 「ANDROID_HOME 存在就加 androidTarget」，于是 CI 会连带编译 Android 目标、
          # 又拿不到匹配的 SDK 组件而失败。本 job 只验证 desktop/共享代码，
          # 因此显式去掉 Android 环境（Android 编译需要单独的 SDK 配置，暂不在 CI 覆盖）。
          unset ANDROID_HOME ANDROID_SDK_ROOT
          ./gradlew --no-daemon :shared:compileKotlinDesktop :composeApp:compileKotlinDesktop
      - name: 单元测试与协议 golden
        working-directory: client
        # E2E（ImClientE2eTest / Phase2E2eTest / Phase3E2eTest）需要真实的
        # MySQL/Redis + logic/gateway，因此这里只跑不依赖服务端的用例。
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT
          ./gradlew --no-daemon :shared:desktopTest \
            --tests 'im.client.proto.*' \
            --tests 'im.client.store.*' \
            --tests 'im.client.net.*'

  # Android 目标的构建保障。此前这里是完全空白：Android 源码从未被编译过，
  # 因此积累了三处致命问题（AGP 应用顺序、缺 android.useAndroidX、compileSdk 与
  # Compose 1.12 的版本矩阵不匹配）。现在它们都已修掉，用这个 job 守住。
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 platform 37 与 build-tools 37
        # runner 镜像自带 Android SDK 并已导出 ANDROID_HOME，这里只需补装 37 的组件；
        # 不用第三方 setup-android：它在 runner 上会失败，而 SDK 本来就是现成的。
        run: |
          SDK="$ANDROID_HOME"
          [ -n "$SDK" ] || SDK=/usr/local/lib/android/sdk
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(command -v sdkmanager)
          "$SDKM" --version || true
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" --install "platforms;android-37.0" "build-tools;37.0.0"
          echo "installed:"; ls "$SDK/platforms" "$SDK/build-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: 构建 debug APK
        working-directory: client
        # 注意：这里**要**保留 ANDROID_HOME（runner 自带 SDK 已导出），
        # 构建脚本才会启用 androidTarget（见 gradle.properties 里的 AGP 兼容开关）；
        # client / e2e 两个 job 则相反，会显式 unset 它，只验证 desktop
        run: ./gradlew --no-daemon :composeApp:assembleDebug
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: composeApp-debug-apk
          path: client/composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建服务端镜像
        run: |
          docker build \
            --build-arg VERSION=$(git rev-parse --short HEAD) \
            -t im-server:ci \
            -f server/deploy/Dockerfile server

  # 端到端：真起 MySQL/Redis/MinIO + 三进程，跑客户端的 5 个 E2E 用例。
  # 这一层是本地验证过、但此前完全没有自动化的部分（协议、投递、封禁、撤销都靠它兜底）。
  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: im
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot123"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      IM_MYSQL_DSN: root:root123@tcp(127.0.0.1:3306)/im?parseTime=true
      IM_REDIS_ADDR: 127.0.0.1:6379
      IM_JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      IM_ADMIN_TOKEN: smoke-admin-token
      IM_LIVEKIT_API_KEY: devkey
      IM_LIVEKIT_API_SECRET: devsecret-devsecret-devsecret-devsecre
      IM_STORAGE_ENDPOINT: 127.0.0.1:9000
      IM_STORAGE_ACCESS_KEY: testadmin
      IM_STORAGE_SECRET_KEY: testadmin123
      IM_STORAGE_BUCKET: im-attachments
      IM_STORAGE_PATH_STYLE: "true"
      IM_AUTH_RATE_LIMIT: "60"
      IM_TRUST_PROXY: "true"
      IM_TEST_API: http://127.0.0.1:10002
      IM_TEST_WS: ws://127.0.0.1:10001/ws
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # 不启 MinIO：E2E 只建无图动态，不涉及任何上传；
      # 附件相关的接口在存储不可用时返回 503，而 /healthz 只看 MySQL 与 Redis，
      # 因此少一个依赖反而更稳（也避免 CI 受镜像仓库配额/变更影响）。
      - name: 初始化数据库
        # CI 直接跑编译好的二进制，不经过 entrypoint.sh，因此建表要手工做一次；
        # 本地调试时数据库通常已经存在，这个坑只会在干净环境暴露。
        run: |
          if command -v mysql >/dev/null; then
            mysql -h127.0.0.1 -P3306 -uroot -proot123 < server/deploy/schema.sql
          else
            CID=$(docker ps -q --filter ancestor=mysql:8.4 | head -1)
            docker exec -i "$CID" mysql -uroot -proot123 < server/deploy/schema.sql
          fi
          echo "schema applied"
      - name: 起服务端并跑 E2E
        run: |
          set -e
          cd server
          go build -o /tmp/im-logic ./cmd/logic
          go build -o /tmp/im-gateway ./cmd/gateway
          go build -o /tmp/im-admin ./cmd/admin
          IM_LOGIC_ADDR=:10002 IM_NODE_ID=91 nohup /tmp/im-logic   >/tmp/logic.log   2>&1 &
          IM_GATEWAY_ADDR=:10001 IM_NODE_ID=92 nohup /tmp/im-gateway >/tmp/gateway.log 2>&1 &
          IM_ADMIN_ADDR=:10003 nohup /tmp/im-admin                  >/tmp/admin.log   2>&1 &
          # 用探针等就绪，而不是 sleep 猜时间
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:10002/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:10002/healthz
          curl -sf http://127.0.0.1:10001/healthz
          curl -sf http://127.0.0.1:10003/healthz
          # E2E 依赖这两个已注册账号（密码 secret1）
          curl -s -X POST http://127.0.0.1:10002/v1/register -d '{"username":"alice","password":"secret1"}' >/dev/null
          curl -s -X POST http://127.0.0.1:10002/v1/register -d '{"username":"bob","password":"secret1"}'   >/dev/null
          cd ../client
          # 同 client job：去掉 runner 预装的 Android SDK 影响（构建脚本见到 ANDROID_HOME 就加 androidTarget）
          unset ANDROID_HOME ANDROID_SDK_ROOT
          ./gradlew --no-daemon :shared:desktopTest \
            --tests 'im.client.ImClientE2eTest' \
            --tests 'im.client.Phase2E2eTest' \
            --tests 'im.client.Phase3E2eTest'
      - name: 失败时输出服务端日志
        if: failure()
        run: |
          tail -50 /tmp/logic.log /tmp/gateway.log /tmp/admin.log || true

