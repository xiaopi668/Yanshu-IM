org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.caching=true
# Android：Compose/SQLDelight 的依赖全部是 AndroidX，AGP 要求显式开启该开关，
# 否则 debugCompileClasspath 解析直接失败（Android 目标此前从未真正编译过）
android.useAndroidX=true
# AGP 9 起 com.android.* 与 org.jetbrains.kotlin.multiplatform 不再直接兼容，
# 官方给的临时开关就是这两个（见报错里的 Solution）。长期方案是把 shared 迁到
# com.android.kotlin.multiplatform.library、把 composeApp 拆成「非 KMP 的 app 模块 +
# KMP UI 库」，那是独立一次重构，先按官方兼容模式跑通。
android.builtInKotlin=false
android.newDsl=false
# Web (Wasm) 开关
kotlin.js.yarn=false
org.jetbrains.compose.experimental.wasm.enabled=true
