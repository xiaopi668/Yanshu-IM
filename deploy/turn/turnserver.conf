# coturn 自托管 TURN/STUN 配置（可选）
#
# 默认部署已改用 LiveKit 内嵌 TURN（见 ../livekit.yaml 的 turn 段），本文件仅在
# 你需要独立 coturn 时使用；启用方法见 docker-compose.yml 中被注释掉的 coturn 服务。
#
# 两个关键点：
#   1) external-ip 必须是客户端可达的公网地址，写 127.0.0.1 会导致中继地址不可用。
#      机器有公网 IP 直接绑定网卡时可整行删掉（自动使用本机地址）；NAT 后必须显式写。
#   2) 必须放行 listening-port 与 min-port~max-port 的 UDP。
listening-port=3478
listening-ip=0.0.0.0
# external-ip=203.0.113.10
min-port=49160
max-port=49200
user=imuser:impass
realm=im.local
# 本地联调不开 TLS；生产请启用 tls-listening-port 并配证书
no-tls
no-cli
fingerprint
