# IM 全套私有化部署：MySQL + Redis + MinIO + LiveKit SFU(内嵌 TURN) + logic + gateway + admin
#
# 需放行的端口：10001(WS) 10002(API) 7880/7881(信令) 50000-50200/UDP(WebRTC)
#               3478/UDP + 49160-49200/UDP(LiveKit 内嵌 TURN)
# 不需要对外：9000/9001(MinIO) 10003(管理后台) —— 它们只绑 127.0.0.1，走 SSH 隧道或反代
#
# 用法：
#   cp deploy/.env.example deploy/.env && 编辑填入随机密钥
#   cd server && docker build --build-arg VERSION=$(git rev-parse --short HEAD) \
#       -t im-server:latest -f deploy/Dockerfile . && cd ..
#   docker compose -f deploy/docker-compose.yml up -d
#
# 每个服务都带 /healthz 探针（会 ping MySQL 与 Redis），docker ps 里能直接看到健康状态；
# /metrics 暴露 Prometheus 文本指标（在线连接数、发送失败、跨进程广播失败等）。

x-logging: &default-logging
  # 默认 json-file 不轮转，长时间运行会把宿主机磁盘写满
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-limits: &default-limits
  # 单个服务打满内存时不要拖垮整台机器
  resources:
    limits:
      cpus: "2.0"
      memory: 1G
    reservations:
      memory: 128M

services:
  mysql:
    restart: unless-stopped
    # 固定到次版本号：latest/大版本会在重拉时悄悄升级，部署不可复现。
    # 要完全可复现可改用 digest：docker inspect --format '{{index .RepoDigests 0}}' mysql:8.4
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${IM_MYSQL_ROOT_PASSWORD:?必须设置 IM_MYSQL_ROOT_PASSWORD（数据库 root 口令）}
      # 仅用于初始化脚本创建最小权限应用账号
      IM_APP_PASSWORD: ${IM_APP_PASSWORD:?必须设置 IM_APP_PASSWORD（应用库账号口令）}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅首次初始化（数据目录为空）时执行：创建 im 账号，只授予 im 库权限
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      retries: 20
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  redis:
    restart: unless-stopped
    # 同上：固定次版本号，避免重拉时被动升级
    image: redis:7.4
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  minio:
    restart: unless-stopped
    image: elestio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${IM_MINIO_ROOT_USER:?必须设置 IM_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${IM_MINIO_ROOT_PASSWORD:?必须设置 IM_MINIO_ROOT_PASSWORD}
    ports:
      # 只绑本机：对象存储里有全部附件与聊天归档，绝不能直接暴露到公网
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  livekit:
    restart: unless-stopped
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    network_mode: host
    environment:
      # LiveKit 用 LIVEKIT_KEYS 覆盖配置文件里的 keys 段，
      # 于是「签发 token 的 gateway」和「校验 token 的 SFU」共用同一份密钥（单一来源）。
      LIVEKIT_KEYS: "${IM_LIVEKIT_API_KEY:?必须设置 IM_LIVEKIT_API_KEY}: ${IM_LIVEKIT_API_SECRET:?必须设置 IM_LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    logging: *default-logging

  # coturn 已改为使用 LiveKit 内嵌 TURN（见 livekit.yaml 的 turn 段）：
  # 内嵌实现与 LiveKit 凭证体系打通、客户端自动拿到 ICE server，且无需维护独立容器。
  # 两者都监听 3478/UDP，**不可同时启用**。若坚持用外部 coturn，请：
  #   1) 注释掉 livekit.yaml 里的整段 turn；
  #   2) 取消下面 coturn 的注释，并把 turnserver.conf 的 external-ip 改成你的公网 IP；
  #   3) 在 livekit.yaml 的 rtc 段补 turn_servers 指向该 coturn。
  # coturn:
  #   restart: unless-stopped
  #   image: coturn/coturn:latest
  #   network_mode: host
  #   volumes:
  #     - ./turn/turnserver.conf:/etc/coturn/turnserver.conf:ro

  logic:
    restart: unless-stopped
    build:
      context: ../server
      dockerfile: deploy/Dockerfile
    image: im-server:latest
    environment:
      IM_ROLE: logic
      # 角色已知时只校验本角色用到的密钥（见 config.CheckSecrets）
      IM_ENV: production
      IM_MYSQL_HOST: mysql
      # 应用连库用最小权限账号（只有 im 库权限），不是 root
      IM_MYSQL_USER: im
      IM_MYSQL_PASSWORD: ${IM_APP_PASSWORD:?}
      IM_REDIS_ADDR: redis:6379
      IM_JWT_SECRET: ${IM_JWT_SECRET:?必须设置 IM_JWT_SECRET（登录令牌签名密钥）}
      IM_STORAGE_ENDPOINT: minio:9000
      IM_STORAGE_ACCESS_KEY: ${IM_MINIO_ROOT_USER:?}
      IM_STORAGE_SECRET_KEY: ${IM_MINIO_ROOT_PASSWORD:?}
      IM_STORAGE_BUCKET: im-attachments
      IM_STORAGE_PATH_STYLE: "true"
      # 多副本部署时必须给每个实例设置不同的 IM_NODE_ID，否则雪花 ID 会碰撞
      IM_NODE_ID: ${IM_LOGIC_NODE_ID:-2}
    ports:
      - "10002:10002"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:10002/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 只等容器起来，不等 healthcheck：对象存储的就绪由 logic 启动时的后台重试兜底
      minio:
        condition: service_started
    logging: *default-logging
    deploy: *default-limits

  admin:
    restart: unless-stopped
    image: im-server:latest
    environment:
      IM_ROLE: admin
      IM_ENV: production
      IM_MYSQL_HOST: mysql
      # 应用连库用最小权限账号（只有 im 库权限），不是 root
      IM_MYSQL_USER: im
      IM_MYSQL_PASSWORD: ${IM_APP_PASSWORD:?}
      IM_REDIS_ADDR: redis:6379
      IM_ADMIN_TOKEN: ${IM_ADMIN_TOKEN:?必须设置 IM_ADMIN_TOKEN（管理后台令牌）}
      IM_STORAGE_ENDPOINT: minio:9000
      IM_STORAGE_ACCESS_KEY: ${IM_MINIO_ROOT_USER:?}
      IM_STORAGE_SECRET_KEY: ${IM_MINIO_ROOT_PASSWORD:?}
      IM_STORAGE_PATH_STYLE: "true"
    ports:
      # 管理后台能重置任意用户密码、改站点配置，默认只绑本机
      - "127.0.0.1:10003:10003"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:10003/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    deploy: *default-limits

  gateway:
    restart: unless-stopped
    image: im-server:latest
    environment:
      IM_ROLE: gateway
      IM_ENV: production
      IM_MYSQL_HOST: mysql
      # 应用连库用最小权限账号（只有 im 库权限），不是 root
      IM_MYSQL_USER: im
      IM_MYSQL_PASSWORD: ${IM_APP_PASSWORD:?}
      IM_REDIS_ADDR: redis:6379
      IM_JWT_SECRET: ${IM_JWT_SECRET:?}
      # 真正签发 LiveKit token 的是 gateway，因此密钥必须给它（旧版本错发给了 logic）
      IM_LIVEKIT_API_KEY: ${IM_LIVEKIT_API_KEY:?}
      IM_LIVEKIT_API_SECRET: ${IM_LIVEKIT_API_SECRET:?}
      IM_NODE_ID: ${IM_GATEWAY_NODE_ID:-1}
    ports:
      - "10001:10001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:10001/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    deploy: *default-limits

volumes:
  mysql-data:
  redis-data:
  minio-data:
