[package]
name = "yanshu-call-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "雁书桌面端通话侧车：JSON-lines over stdio，媒体由 LiveKit 承载"
license = "MIT"
publish = false

[[bin]]
name = "yanshu-call-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# 真正的媒体栈。默认关闭：
#   - 编译需要 cmake + clang（libwebrtc 由 webrtc-sys 构建/下载），体积大、耗时长
#   - 协议与 JVM 侧不依赖它，可以在没有这些工具链的机器上开发和跑测试
# 生产构建：cargo build --release --features livekit
livekit = { version = "0.10", optional = true }

[features]
default = []
livekit = ["dep:livekit"]

[profile.release]
lto = true
codegen-units = 1
strip = true
